openapi: "3.0.3"
info:
  title: Meme Radar API
  version: "2.0.0"
  description: |
    Meme Radar 后端接口契约（v2，按现有前端页面重写）。设计说明见 docs/engineering/01-api.md，
    表结构见 docs/engineering/02-data-model.md。响应字段与前端 zod 校验（frontend/src/lib/api/schemas.ts）逐字段一致。

    通用规则：
    - 公开接口前缀 `/api/v1`；`/healthz` 不带前缀。
    - 金额、价格、数量一律为十进制字符串（`Decimal`），前端只格式化不运算；比例由后端给出。
    - 未知为 `null`（前端显示 `--`），已知 0 返回 `"0"`；不得用 0 代替未知。
    - `coverage`：`complete` 表示所请求窗口完全落在该链连续已采集区间内；否则为 `partial`，
      完整统计字段为 `null`，只有 `observed*` 字段给出已看到的下界。
    - 地址：Solana 为 base58，EVM 为 EIP-55 校验和地址；Uniswap v4 池用 32 字节 PoolId。
    - 时间为 RFC 3339 UTC；K 线时间戳为 Unix 秒。
    - 错误统一为 `ErrorResponse`；每个响应带 `X-Trace-Id`（32 位十六进制），请求可带 `X-Trace-Id` 或 `traceparent` 沿用。
    - 管理接口需 `Authorization: Bearer <RADAR_ADMIN_TOKEN>`，缺失或错误返回 403。
    - 前端用 openapi-typescript 从本文件生成类型（frontend/src/lib/api/schema.gen.ts）。
servers:
  - url: http://localhost:8080
    description: 本地 Go API

security: []

tags:
  - name: system
    description: 健康检查
  - name: market
    description: 主流币价格与全局搜索
  - name: inflow
    description: 资金流入列表与概览
  - name: token
    description: Token 详情
  - name: admin
    description: 管理后台（RADAR_ADMIN_TOKEN）

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [system]
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: 依赖不可用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /api/v1/market/natives:
    get:
      operationId: getNativePrices
      tags: [market]
      summary: SOL / ETH / BNB 美元价（底部栏）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NativePricesResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/search:
    get:
      operationId: search
      tags: [market]
      summary: 全局搜索 Token 与钱包
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "#/components/parameters/ChainFilter"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/smart-money/overview:
    get:
      operationId: getSmartMoneyOverview
      tags: [inflow]
      summary: 资金流入页顶部概览卡片
      description: |
        按链与窗口读取当前激活名单的聪明钱汇总；大仓为单笔买入 > 5,000 美元，其余已知金额为小仓。窗口未完整覆盖时完整字段为 null。
      parameters:
        - $ref: "#/components/parameters/ChainFilter"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/smart-money/inflow/facets:
    get:
      operationId: getInflowFacets
      tags: [inflow]
      summary: DEX 与发射平台候选（工具栏下拉）
      description: |
        当前窗口内有成交的 DEX 与发射平台候选及其成交额；窗口未完整覆盖时 volume_usd/token_count 为 null，observed_token_count 为已看到的下界。
      parameters:
        - $ref: "#/components/parameters/ChainFilter"
        - $ref: "#/components/parameters/Window"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacetsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/smart-money/inflow:
    get:
      operationId: listInflow
      tags: [inflow]
      summary: 资金流入列表（固定快照分页）
      description: |
        首次请求（不带 query_id）在一致的投影版本上筛选、排序，冻结前 2,000 行完整值与 list_version，
        存入 API 进程内有界 LRU（TTL 10 分钟），返回 query_id 与第一批。翻页只读 query_id/offset/limit，切片原快照。
        排序值相同按 (chain, address) 升序；排序列为 null 时恒排最后；设置某字段 min/max 时该字段为 null 的行被排除。
        query_id 过期、不在本实例或投影已失效时返回 410，前端按 URL 条件重新查询。
      parameters:
        - name: query_id
          in: query
          schema: { type: string }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: "#/components/parameters/ChainFilter"
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Currency"
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/InflowSortKey" }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: dex
          in: query
          schema: { type: string }
        - name: platform
          in: query
          schema: { type: string }
        - { name: min_market_cap, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: max_market_cap, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: min_price_change, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: max_price_change, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: min_liquidity, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: max_liquidity, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: min_trades, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_trades, in: query, schema: { type: integer, minimum: 0 } }
        - { name: min_volume, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: max_volume, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: min_net_inflow, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: max_net_inflow, in: query, schema: { $ref: "#/components/schemas/Decimal" } }
        - { name: min_sm_holders, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_sm_holders, in: query, schema: { type: integer, minimum: 0 } }
        - { name: min_sm_trades, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_sm_trades, in: query, schema: { type: integer, minimum: 0 } }
        - { name: min_holders, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_holders, in: query, schema: { type: integer, minimum: 0 } }
        - { name: min_age, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_age, in: query, schema: { type: integer, minimum: 0 } }
        - name: dev_status
          in: query
          schema: { type: string, enum: [sold, holding] }
        - name: socials
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InflowPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410":
          description: query_id 过期或不在本实例；前端用 URL 中的条件重新查询
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Busy" }

  /api/v1/tokens/batch:
    post:
      operationId: batchTokens
      tags: [inflow]
      summary: 可见行 10 秒刷新（不重排）
      description: |
        可见行每 10 秒刷新数值，不改变顺序。带 query_id 时校验窗口、计价与 list_version；名单已换版或快照失效返回 410，
        前端暂停刷新、保留旧分页并提示重查。已不在投影中的 Token 不出现在 items 中。观察列表调用不带 query_id，读当前投影。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "410":
          description: 快照已失效或名单已换版；暂停刷新并提示重新查询
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: getToken
      tags: [token]
      summary: Token 头部、行情、窗口摘要、开发者、同名代币
      parameters:
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/candles:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: getCandles
      tags: [token]
      summary: K 线（按主池，1s/30s 由成交现算）
      description: |
        基于主池成交生成；主池切换处在 pool_switches 标注。美元价缺失的区间写入 gaps；未收盘或窗口未完整覆盖的柱放在 observed_items。
      parameters:
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CandleInterval" }
        - name: metric
          in: query
          schema: { type: string, enum: [price, market_cap], default: price }
        - $ref: "#/components/parameters/Currency"
        - name: from
          in: query
          schema: { type: integer }
        - name: to
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 300 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CandlesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/activities:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: listActivities
      tags: [token]
      summary: 活动流（成交、加减池）
      description: |
        按链上位置倒序的成交与加减池记录，游标分页。label 过滤基于当前激活名单与地址标签；未归因成交只出现在 all。
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [all, trade, liquidity], default: all }
        - name: label
          in: query
          schema: { $ref: "#/components/schemas/ActivityLabelFilter" }
        - name: from
          in: query
          schema: { type: integer }
        - name: to
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/holders:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: listHolders
      tags: [token]
      summary: 持有者（带覆盖范围）
      description: |
        当前余额排名。余额来自已采集范围内的转账/成交增量；Token 创建早于采集起点时 coverage.status 为 partial。
      parameters:
        - name: label
          in: query
          schema: { type: string, enum: [all, smart_money], default: all }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldersResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/pools:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: listPools
      tags: [token]
      summary: 流动性池
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PoolsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/liquidity-events:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: listLiquidityEvents
      tags: [token]
      summary: 流动性变化
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiquidityEventsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/tokens/{chain}/{address}/smart-money:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    get:
      operationId: getTokenSmartMoney
      tags: [token]
      summary: 该 Token 的聪明钱持仓与近期动作
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenSmartMoneyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/imports:
    post:
      operationId: createSmartMoneyImport
      tags: [admin]
      summary: 上传名单（CSV/JSON，≤10,000 行、≤5MB），只校验不生效
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: 文件超过上传上限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/imports/{id}/apply:
    post:
      operationId: applySmartMoneyImport
      tags: [admin]
      summary: 确认导入，异步准备新名单版本
      security: [{ adminToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, enum: [2] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListVersionChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: 导入已过期或已应用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/members:
    get:
      operationId: listSmartMoneyMembers
      tags: [admin]
      summary: 当前名单成员
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ChainFilter"
        - name: source
          in: query
          schema: { type: string, enum: [all, import, auto], default: all }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembersResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/ListCursorExpired" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/members/{chain}/{address}:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    delete:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      operationId: removeSmartMoneyMember
      tags: [admin]
      summary: 移除导入来源的地址，生成新名单版本
      security: [{ adminToken: [] }]
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, enum: [2] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListVersionChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/exclusions:
    get:
      operationId: listSmartMoneyExclusions
      tags: [admin]
      summary: 排除名单
      security: [{ adminToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ChainFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410": { $ref: "#/components/responses/ListCursorExpired" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      operationId: addSmartMoneyExclusion
      tags: [admin]
      summary: 排除全部聪明钱统计，保留管理记录；异步生成新名单版本
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExclusionRequest" }
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, enum: [2] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListVersionChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/exclusions/{chain}/{address}:
    parameters:
      - $ref: "#/components/parameters/ChainPath"
      - $ref: "#/components/parameters/AddressPath"
    delete:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      operationId: removeSmartMoneyExclusion
      tags: [admin]
      summary: 恢复地址
      security: [{ adminToken: [] }]
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, enum: [2] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListVersionChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/imports/{id}:
    get:
      operationId: getSmartMoneyImport
      tags: [admin]
      summary: 恢复导入预览与已应用版本关联
      security: [{ adminToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/list-builds/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ListVersion" }
    get:
      operationId: getSmartMoneyListBuild
      tags: [admin]
      summary: 查询名单准备、失败、阻塞与激活状态
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListBuildStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/smart-money/list-builds/{version}/retry:
    post:
      operationId: retrySmartMoneyListBuild
      tags: [admin]
      summary: 重试相同成员版本；不创建版本、不重新激活已完成版本
      security: [{ adminToken: [] }]
      parameters:
        - name: version
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ListVersion" }
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, enum: [2] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListBuildStatus" }
        "200":
          description: 该版本已就绪或已激活，无需重试
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListBuildStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/admin/health:
    get:
      operationId: getAdminHealth
      tags: [admin]
      summary: 运行质量：采集进度、解码模块、失败任务、数据源预算
      description: |
        各链数据流游标与积压、各解码模块进度与失败、当月数据源用量。数据库不可用时返回 503。
      security: [{ adminToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: 数据库不可用
          headers:
            X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admin/parse-failures/{id}/retry:
    post:
      operationId: retryParseFailure
      tags: [admin]
      summary: 重试失败的解码任务
      security: [{ adminToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: 已接受，后台异步准备；用 list-builds/{version} 查询状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParseFailure" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    ChainFilter:
      name: chain
      in: query
      schema: { $ref: "#/components/schemas/Chain" }
    ChainPath:
      name: chain
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Chain" }
    AddressPath:
      name: address
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Address" }
    Window:
      name: window
      in: query
      schema: { $ref: "#/components/schemas/Window" }
    Currency:
      name: currency
      in: query
      schema: { type: string, enum: [usd, native], default: usd }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    XTraceId:
      schema: { type: string, pattern: '^[0-9a-f]{32}$' }

  responses:
    BadRequest:
      description: 参数不合法；error.field 指出字段
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 不存在
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 管理接口未配置 RADAR_ADMIN_TOKEN，拒绝所有管理请求
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 管理凭证缺失或错误
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 单 IP 每分钟超过 60 次新查询
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Busy:
      description: 查询超过 2 秒或投影正在切换；前端保留已加载行并提示重试
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

    ListCursorExpired:
      description: 游标无效、被修改或与当前筛选不匹配
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 内部错误；不含数据库或凭证细节
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: 所需投影尚未就绪（error.code=api_unavailable）
      headers:
        X-Trace-Id: { $ref: "#/components/headers/XTraceId" }
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Chain:
      type: string
      enum: [solana, base, bsc]

    Window:
      type: string
      enum: [1m, 5m, 1h, 4h, 24h]
      default: 1h

    SummaryWindow:
      type: string
      enum: [5m, 1h, 4h, 24h]

    CandleInterval:
      type: string
      enum: [1s, 30s, 1m, 5m, 1h, 1d]

    Address:
      type: string
      minLength: 32
      maxLength: 44

    PoolIdentifier:
      oneOf:
        - $ref: "#/components/schemas/Address"
        - type: string
          pattern: '^0x[0-9a-fA-F]{64}$'

    TxHash:
      type: string

    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      example: "30786.83"

    NullableDecimal:
      type: string
      nullable: true
      pattern: '^-?\d+(\.\d+)?$'

    Currency:
      type: string
      enum: [USD, SOL, ETH, BNB]

    Timestamp:
      type: string
      format: date-time

    ListVersion:
      type: string

    ErrorCode:
      type: string
      enum:
        - invalid_param
        - invalid_range
        - unauthorized
        - forbidden
        - not_found
        - import_closed
        - query_expired
        - file_too_large
        - too_many_rows
        - invalid_file
        - secret_detected
        - rate_limited
        - busy
        - api_unavailable
        - internal

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
            field:
              type: string
              nullable: true
            trace_id:
              type: string
              pattern: '^[0-9a-f]{32}$'

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string

    NativePrice:
      type: object
      required: [chain, symbol, price_usd, change_24h_pct, stale, as_of]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        symbol: { type: string, enum: [SOL, ETH, BNB] }
        price_usd: { $ref: "#/components/schemas/NullableDecimal" }
        change_24h_pct: { $ref: "#/components/schemas/NullableDecimal" }
        stale: { type: boolean}
        as_of: { $ref: "#/components/schemas/Timestamp" }

    NativePricesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NativePrice" }

    Socials:
      type: object
      properties:
        twitter: { type: string, nullable: true }
        telegram: { type: string, nullable: true }
        website: { type: string, nullable: true }
        github: { type: string, nullable: true }

    TokenRef:
      type: object
      required: [chain, address, symbol, name]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }
        symbol: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 128 }
        image_url:
          type: string
          nullable: true
        launch_platform: { type: string, nullable: true }
        launch_at:
          type: string
          format: date-time
          nullable: true

    SearchToken:
      allOf:
        - $ref: "#/components/schemas/TokenRef"
        - type: object
          required: [market_cap_usd, age_seconds, last_trade_at]
          properties:
            market_cap_usd: { $ref: "#/components/schemas/NullableDecimal" }
            age_seconds: { type: integer, nullable: true }
            last_trade_at: { type: string, format: date-time, nullable: true }

    SearchWallet:
      type: object
      required: [chain, address, label, is_smart_money]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }
        label: { type: string, nullable: true }
        is_smart_money: { type: boolean }

    SearchResponse:
      type: object
      required: [tokens, wallets]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/SearchToken" }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/SearchWallet" }

    OverviewResponse:
      type: object
      required:
        - as_of
        - list_version
        - window
        - net_inflow_usd
        - net_inflow_change_pct
        - active_wallets
        - tracked_tokens
        - new_tokens
        - buy_volume_usd
        - sell_volume_usd
        - buy_share_pct
        - large_buy_volume_usd
        - small_buy_volume_usd
        - large_buy_share_pct
        - small_buy_share_pct
        - inflow_bars
        - coverage
      properties:
        as_of: { $ref: "#/components/schemas/Timestamp" }
        list_version: { $ref: "#/components/schemas/ListVersion" }
        window: { $ref: "#/components/schemas/Window" }
        coverage:
          type: string
          enum: [partial, complete]
        net_inflow_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        net_inflow_change_pct:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        active_wallets:
          type: integer
          nullable: true
        tracked_tokens:
          type: integer
          minimum: 0
          nullable: true
        new_tokens:
          type: integer
          nullable: true
        buy_volume_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        sell_volume_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        buy_share_pct:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        large_buy_volume_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        small_buy_volume_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        large_buy_share_pct:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        small_buy_share_pct:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        inflow_bars:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/NullableDecimal" }

    Facet:
      type: object
      required: [id, name, volume_usd, token_count, observed_token_count]
      properties:
        id: { type: string, example: pumpswap }
        name: { type: string, example: PumpSwap }
        chain: { $ref: "#/components/schemas/Chain" }
        volume_usd: { $ref: "#/components/schemas/NullableDecimal" }
        token_count:
          type: integer
          nullable: true
        observed_token_count:
          type: integer
          format: int64
          minimum: 0

    FacetsResponse:
      type: object
      required: [dexes, platforms, coverage]
      properties:
        coverage:
          type: string
          enum: [partial, complete]
        dexes:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
        platforms:
          type: array
          items: { $ref: "#/components/schemas/Facet" }

    InflowSortKey:
      type: string
      enum: [age, sm_holders, sm_trades, market_cap, liquidity, trades, volume, net_inflow]
      default: sm_trades

    InflowRow:
      description: 资金流入一行。trades/buys/sells/volume/net_inflow 等完整统计在 coverage=partial 时为 null；observed 为已看到成交的下界计数。
      type: object
      required:
        - token
        - currency
        - price
        - market_cap
        - price_change_pct
        - liquidity
        - trades
        - buys
        - sells
        - observed
        - coverage
        - volume
        - net_inflow
        - sm_holders
        - sm_trades
        - holders
        - age_seconds
        - dexes
        - socials
        - sparkline
      properties:
        token: { $ref: "#/components/schemas/TokenRef" }
        currency: { $ref: "#/components/schemas/Currency" }
        price: { $ref: "#/components/schemas/NullableDecimal" }
        market_cap: { $ref: "#/components/schemas/NullableDecimal" }
        price_change_pct: { $ref: "#/components/schemas/NullableDecimal" }
        liquidity: { $ref: "#/components/schemas/NullableDecimal" }
        trades: { type: integer, nullable: true }
        buys: { type: integer, nullable: true }
        sells: { type: integer, nullable: true }
        observed:
          type: object
          required: [trades, buys, sells]
          properties:
            trades: { type: integer, format: int64, minimum: 0 }
            buys: { type: integer, format: int64, minimum: 0 }
            sells: { type: integer, format: int64, minimum: 0 }
        coverage:
          type: string
          enum: [partial, complete]
        volume: { $ref: "#/components/schemas/NullableDecimal" }
        net_inflow:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        sm_holders: { type: integer, nullable: true }
        sm_trades: { type: integer, nullable: true }
        holders: { type: integer, nullable: true }
        age_seconds: { type: integer, nullable: true }
        dexes:
          type: array
          items: { type: string }
        socials: { $ref: "#/components/schemas/Socials" }
        sparkline:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/NullableDecimal" }

    InflowPage:
      type: object
      required: [query_id, list_version, as_of, window, total, truncated, offset, next_offset, items]
      properties:
        query_id: { type: string }
        list_version: { $ref: "#/components/schemas/ListVersion" }
        as_of:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        chain_as_of: { $ref: "#/components/schemas/ChainTimes" }
        window: { $ref: "#/components/schemas/Window" }
        total:
          type: integer
        truncated:
          type: boolean
        offset: { type: integer }
        next_offset:
          type: integer
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/InflowRow" }

    TokenKey:
      type: object
      required: [chain, address]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }

    BatchRequest:
      type: object
      required: [window, tokens]
      properties:
        window: { $ref: "#/components/schemas/Window" }
        currency:
          type: string
          enum: [usd, native]
          default: usd
        query_id: { type: string}
        list_version: { $ref: "#/components/schemas/ListVersion" }
        tokens:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/TokenKey" }

    BatchResponse:
      type: object
      required: [as_of, list_version, items]
      properties:
        as_of:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        chain_as_of: { $ref: "#/components/schemas/ChainTimes" }
        list_version: { $ref: "#/components/schemas/ListVersion" }
        items:
          type: array
          items: { $ref: "#/components/schemas/InflowRow" }

    ChainTimes:
      description: 各链投影实际截止时间；全部链视图下各链可能不同。
      type: object
      additionalProperties: false
      properties:
        solana: { $ref: "#/components/schemas/Timestamp" }
        base: { $ref: "#/components/schemas/Timestamp" }
        bsc: { $ref: "#/components/schemas/Timestamp" }

    WindowSummary:
      type: object
      required: [window, volume, net_inflow, traders, buys, sells, buy_volume, sell_volume, price_change_pct]
      properties:
        window: { $ref: "#/components/schemas/SummaryWindow" }
        volume: { $ref: "#/components/schemas/NullableDecimal" }
        net_inflow: { $ref: "#/components/schemas/NullableDecimal" }
        traders: { type: integer, nullable: true }
        buys: { type: integer, nullable: true }
        sells: { type: integer, nullable: true }
        buy_volume: { $ref: "#/components/schemas/NullableDecimal" }
        sell_volume: { $ref: "#/components/schemas/NullableDecimal" }
        price_change_pct: { $ref: "#/components/schemas/NullableDecimal" }

    HolderCoverage:
      description: full：Token 在采集起点之后创建，余额从创建起完整重放；partial：创建更早，只含采集后变化；unknown：尚未处理。
      type: object
      required: [status, since, as_of]
      properties:
        status:
          type: string
          enum: [full, partial, unknown]
        since:
          type: string
          format: date-time
          nullable: true
        as_of: { $ref: "#/components/schemas/Timestamp" }

    PoolRef:
      type: object
      required: [address, dex, quote_symbol]
      properties:
        address: { $ref: "#/components/schemas/PoolIdentifier" }
        dex: { type: string, example: PumpSwap }
        quote_symbol:
          type: string
          nullable: true
          example: SOL

    TokenDetail:
      type: object
      required:
        - token
        - currency
        - as_of
        - decimals
        - total_supply
        - socials
        - creator
        - main_pool
        - price
        - market_cap
        - liquidity
        - volume_24h
        - price_change_24h_pct
        - holders
        - sm_holders
        - ath_market_cap
        - ath_since
        - holder_coverage
        - windows
        - same_name
      properties:
        token: { $ref: "#/components/schemas/TokenRef" }
        currency: { $ref: "#/components/schemas/Currency" }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        decimals: { type: integer }
        total_supply:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        socials: { $ref: "#/components/schemas/Socials" }
        creator:
          type: object
          nullable: true
          required: [address, holding_pct]
          properties:
            address: { $ref: "#/components/schemas/Address" }
            holding_pct: { $ref: "#/components/schemas/NullableDecimal" }
        main_pool:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PoolRef" }]
        price: { $ref: "#/components/schemas/NullableDecimal" }
        market_cap: { $ref: "#/components/schemas/NullableDecimal" }
        liquidity: { $ref: "#/components/schemas/NullableDecimal" }
        volume_24h: { $ref: "#/components/schemas/NullableDecimal" }
        price_change_24h_pct: { $ref: "#/components/schemas/NullableDecimal" }
        holders: { type: integer, nullable: true }
        sm_holders: { type: integer, nullable: true }
        ath_market_cap: { $ref: "#/components/schemas/NullableDecimal" }
        ath_since:
          type: string
          format: date-time
          nullable: true
        holder_coverage: { $ref: "#/components/schemas/HolderCoverage" }
        windows:
          type: array
          items: { $ref: "#/components/schemas/WindowSummary" }
        same_name:
          type: array
          items: { $ref: "#/components/schemas/SearchToken" }

    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: integer}
        o: { $ref: "#/components/schemas/Decimal" }
        h: { $ref: "#/components/schemas/Decimal" }
        l: { $ref: "#/components/schemas/Decimal" }
        c: { $ref: "#/components/schemas/Decimal" }
        v:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]

    ObservedCandle:
      type: object
      required: [t, o, h, l, c, v, closed]
      properties:
        t: { type: integer}
        o: { $ref: "#/components/schemas/Decimal" }
        h: { $ref: "#/components/schemas/Decimal" }
        l: { $ref: "#/components/schemas/Decimal" }
        c: { $ref: "#/components/schemas/Decimal" }
        v: { $ref: "#/components/schemas/NullableDecimal" }
        closed: { type: boolean }

    CandleGap:
      type: object
      required: [from, to, reason]
      properties:
        from: { type: integer}
        to: { type: integer}
        reason: { type: string, enum: [price_unavailable] }

    PoolSwitch:
      type: object
      required: [t, from_pool, to_pool, reason]
      properties:
        t: { type: integer }
        from_pool:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PoolIdentifier" }]
        to_pool: { $ref: "#/components/schemas/PoolIdentifier" }
        reason:
          type: string
          enum: [liquidity, graduation]

    CandlesResponse:
      type: object
      required: [interval, metric, currency, as_of, coverage, empty_reason, items, observed_items, gaps, pool_switches]
      properties:
        interval: { $ref: "#/components/schemas/CandleInterval" }
        metric: { type: string, enum: [price, market_cap] }
        currency: { $ref: "#/components/schemas/Currency" }
        as_of: { $ref: "#/components/schemas/Timestamp" }
        coverage:
          type: string
          enum: [complete, partial]
        empty_reason:
          type: string
          nullable: true
          enum: [no_main_pool, no_price, no_trades, null]
        items:
          type: array
          items: { $ref: "#/components/schemas/Candle" }
        observed_items:
          type: array
          items: { $ref: "#/components/schemas/ObservedCandle" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/CandleGap" }
        pool_switches:
          type: array
          items: { $ref: "#/components/schemas/PoolSwitch" }

    WalletLabel:
      type: string
      enum: [smart_money, kol, insider, whale, sniper, dev, bundler, pro_trader]

    ActivityLabelFilter:
      type: string
      enum: [all, smart_money, kol, insider, whale, sniper, dev, bundler]
      default: all

    WalletRef:
      type: object
      required: [address, labels, display_name]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/WalletLabel" }
        display_name:
          type: string
          nullable: true

    Activity:
      type: object
      required:
        - id
        - time
        - kind
        - wallet
        - attribution
        - token_amount
        - quote_amount
        - quote_symbol
        - value_usd
        - price_usd
        - market_cap_usd
        - tx_hash
        - pool
        - dex
      properties:
        id:
          type: string
        time: { $ref: "#/components/schemas/Timestamp" }
        kind:
          type: string
          enum: [buy, sell, add, remove]
        wallet:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WalletRef" }]
        attribution:
          type: string
          nullable: true
          enum: [confirmed, inferred, ambiguous, null]
        token_amount: { $ref: "#/components/schemas/Decimal" }
        quote_amount:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        quote_symbol:
          type: string
          nullable: true
        value_usd: { $ref: "#/components/schemas/NullableDecimal" }
        price_usd: { $ref: "#/components/schemas/NullableDecimal" }
        market_cap_usd: { $ref: "#/components/schemas/NullableDecimal" }
        tx_hash: { $ref: "#/components/schemas/TxHash" }
        pool: { $ref: "#/components/schemas/PoolIdentifier" }
        dex: { type: string }

    LabelCounts:
      description: 最近 24 小时各地址类型的成交数；窗口未完整覆盖时为 null。
      type: object
      required: [all, smart_money]
      properties:
        all: { type: integer, format: int64, minimum: 0, nullable: true }
        smart_money: { type: integer, format: int64, minimum: 0, nullable: true }
      additionalProperties: { type: integer, format: int64, minimum: 0, nullable: true }

    ActivitiesResponse:
      type: object
      required: [items, next_cursor, label_counts, coverage, label_counts_coverage]
      properties:
        coverage:
          type: string
          enum: [partial, complete]
        label_counts_coverage:
          type: string
          enum: [partial, complete]
        items:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        next_cursor: { type: string, nullable: true }
        label_counts: { $ref: "#/components/schemas/LabelCounts" }

    Holder:
      type: object
      required:
        - rank
        - wallet
        - amount
        - share_pct
        - native_balance
        - avg_buy_price_usd
        - avg_sell_price_usd
        - realized_pnl_usd
        - unrealized_pnl_usd
      properties:
        rank: { type: integer }
        wallet: { $ref: "#/components/schemas/WalletRef" }
        amount: { $ref: "#/components/schemas/Decimal" }
        share_pct: { $ref: "#/components/schemas/NullableDecimal" }
        native_balance:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        avg_buy_price_usd: { $ref: "#/components/schemas/NullableDecimal" }
        avg_sell_price_usd: { $ref: "#/components/schemas/NullableDecimal" }
        realized_pnl_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        unrealized_pnl_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]

    HoldersResponse:
      type: object
      required: [coverage, total, items, next_cursor]
      properties:
        coverage: { $ref: "#/components/schemas/HolderCoverage" }
        total: { type: integer, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/Holder" }
        next_cursor: { type: string, nullable: true }

    Pool:
      type: object
      required:
        - address
        - dex
        - protocol
        - quote_symbol
        - liquidity_usd
        - reserve_token
        - reserve_quote
        - created_at
        - status
        - is_main
      properties:
        address: { $ref: "#/components/schemas/PoolIdentifier" }
        dex: { type: string, example: Uniswap }
        protocol: { type: string, example: uniswap_v4 }
        quote_symbol:
          type: string
          nullable: true
        liquidity_usd: { $ref: "#/components/schemas/NullableDecimal" }
        reserve_token: { $ref: "#/components/schemas/NullableDecimal" }
        reserve_quote: { $ref: "#/components/schemas/NullableDecimal" }
        created_at: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [active, graduated, closed]
        is_main: { type: boolean }

    PoolsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Pool" }

    LiquidityEvent:
      type: object
      required: [id, time, kind, token_amount, quote_amount, quote_symbol, value_usd, wallet, tx_hash, pool, dex]
      properties:
        id: { type: string }
        time: { $ref: "#/components/schemas/Timestamp" }
        kind:
          type: string
          enum: [add, remove]
        token_amount: { $ref: "#/components/schemas/Decimal" }
        quote_amount:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
        quote_symbol: { type: string, nullable: true }
        value_usd: { $ref: "#/components/schemas/NullableDecimal" }
        wallet:
          type: object
          nullable: true
          allOf: [{ $ref: "#/components/schemas/WalletRef" }]
        tx_hash: { $ref: "#/components/schemas/TxHash" }
        pool: { $ref: "#/components/schemas/PoolIdentifier" }
        dex: { type: string }

    LiquidityEventsResponse:
      type: object
      required: [items, next_cursor, coverage]
      properties:
        coverage:
          type: string
          enum: [partial, complete]
        items:
          type: array
          items: { $ref: "#/components/schemas/LiquidityEvent" }
        next_cursor: { type: string, nullable: true }

    TokenSmartMoneyEntry:
      type: object
      required: [wallet, balance, share_pct, buy_volume_usd, sell_volume_usd, last_trade_at]
      properties:
        wallet: { $ref: "#/components/schemas/WalletRef" }
        balance: { $ref: "#/components/schemas/NullableDecimal" }
        share_pct: { $ref: "#/components/schemas/NullableDecimal" }
        buy_volume_usd: { $ref: "#/components/schemas/NullableDecimal" }
        sell_volume_usd: { $ref: "#/components/schemas/NullableDecimal" }
        last_trade_at: { type: string, format: date-time, nullable: true }

    TokenSmartMoneyResponse:
      type: object
      required: [list_version, holders, items]
      properties:
        list_version: { $ref: "#/components/schemas/ListVersion" }
        holders: { type: integer, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/TokenSmartMoneyEntry" }

    ImportRowStatus:
      type: string
      enum: [valid, invalid, duplicate, existing]

    ImportRow:
      type: object
      required: [line, chain, address, label, tags, twitter, source, status, error]
      properties:
        line: { type: integer }
        chain: { type: string, nullable: true }
        address: { type: string, nullable: true }
        label: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        twitter: { type: string, nullable: true }
        source: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ImportRowStatus" }
        error: { type: string, nullable: true }

    ImportReport:
      type: object
      required: [id, file_name, created_at, expires_at, applied, applied_list_version, rows_archived, totals, rows]
      properties:
        id: { type: string }
        file_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        applied: { type: boolean }
        applied_list_version: { type: string, nullable: true }
        rows_archived: { type: boolean }
        totals:
          type: object
          required: [rows, valid, invalid, duplicate, existing]
          properties:
            rows: { type: integer }
            valid: { type: integer }
            invalid: { type: integer }
            duplicate: { type: integer }
            existing: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }

    ListStatus:
      type: string
      enum: [building, active, retired]
    ListBuildState:
      type: string
      enum: [queued, running, ready, activated, failed]
    ListChangeCounts:
      type: object
      required: [added, merged, removed, total_members]
      properties:
        added: { type: integer, minimum: 0 }
        merged: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        total_members: { type: integer, minimum: 0 }
    ListBuildStatus:
      description: 名单版本异步准备状态：准备期间旧版本继续生效，就绪后整体切换。
      type: object
      required: [list_version, previous_version, active_version, status, build_status, blocking_version, created_at, activated_at, error_code, change_counts]
      properties:
        list_version: { $ref: "#/components/schemas/ListVersion" }
        previous_version: { $ref: "#/components/schemas/ListVersion" }
        active_version: { $ref: "#/components/schemas/ListVersion" }
        status: { $ref: "#/components/schemas/ListStatus" }
        build_status: { $ref: "#/components/schemas/ListBuildState" }
        blocking_version: { type: string, nullable: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        activated_at: { type: string, format: date-time, nullable: true }
        error_code: { type: string, nullable: true, enum: [invalid_param, invalid_range, unauthorized, forbidden, not_found, import_closed, query_expired, file_too_large, too_many_rows, invalid_file, secret_detected, rate_limited, busy, api_unavailable, internal, null] }
        change_counts: { $ref: "#/components/schemas/ListChangeCounts" }

    ListVersionChange:
      type: object
      required: [list_version, previous_version, active_version, status, build_status, added, merged, removed, total_members]
      properties:
        list_version: { $ref: "#/components/schemas/ListVersion" }
        previous_version: { $ref: "#/components/schemas/ListVersion" }
        active_version: { $ref: "#/components/schemas/ListVersion" }
        status: { $ref: "#/components/schemas/ListStatus" }
        build_status: { $ref: "#/components/schemas/ListBuildState" }
        added: { type: integer }
        merged: { type: integer }
        removed: { type: integer }
        total_members: { type: integer }

    Member:
      type: object
      required: [chain, address, label, tags, twitter, sources, added_at, excluded]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }
        label: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        twitter: { type: string, nullable: true }
        sources:
          type: array
          items:
            type: string
            enum: [import, auto]
        added_at: { $ref: "#/components/schemas/Timestamp" }
        excluded: { type: boolean }

    MembersResponse:
      type: object
      required: [list_version, total, items, next_cursor]
      properties:
        list_version: { $ref: "#/components/schemas/ListVersion" }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_cursor: { type: string, nullable: true }

    ExclusionRequest:
      type: object
      required: [chain, address, reason]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }
        reason: { type: string, minLength: 1, maxLength: 200 }

    Exclusion:
      type: object
      required: [chain, address, reason, created_at]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        address: { $ref: "#/components/schemas/Address" }
        reason: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    ExclusionsResponse:
      type: object
      required: [list_version, items, next_cursor]
      properties:
        list_version: { $ref: "#/components/schemas/ListVersion" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Exclusion" }
        next_cursor: { type: string, nullable: true }

    ChainHealth:
      description: anchor 为数据流起点；lower_bound/history_position 为回补下界与进度；forward_position 为前向连续完成位置。
      type: object
      required: [chain, head, anchor, lower_bound, forward_position, history_position, backlog_blocks, lag_seconds, gaps_open, gaps_by_reason, last_error, budget_paused]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        head: { type: integer, nullable: true}
        anchor: { type: integer}
        lower_bound: { type: integer}
        forward_position: { type: integer, nullable: true}
        history_position: { type: integer, nullable: true}
        backlog_blocks: { type: integer, nullable: true }
        lag_seconds: { type: integer, nullable: true }
        gaps_open: { type: integer }
        gaps_by_reason:
          type: object
          additionalProperties: { type: integer }
        last_error:
          type: object
          nullable: true
          required: [kind, message, at]
          properties:
            kind:
              type: string
              enum: [retryable, config, not_found, history_unavailable, incomplete]
            message: { type: string }
            at: { $ref: "#/components/schemas/Timestamp" }
        budget_paused: { type: boolean }

    ParserHealth:
      description: 按协议解码模块统计进度、隔离与未识别指令数。
      type: object
      required: [chain, module, version, position, lag_blocks, quarantined, failures, unknown_discriminators]
      properties:
        chain: { $ref: "#/components/schemas/Chain" }
        module: { type: string, example: pumpswap }
        version: { type: string }
        position: { type: integer, nullable: true }
        lag_blocks: { type: integer, nullable: true }
        quarantined: { type: integer }
        failures: { type: integer }
        unknown_discriminators: { type: integer }

    ParseFailure:
      type: object
      required: [id, chain, module, position, error, attempts, status, last_attempt_at]
      properties:
        id: { type: string }
        chain: { $ref: "#/components/schemas/Chain" }
        module: { type: string }
        position: { type: string}
        error: { type: string }
        attempts: { type: integer }
        status:
          type: string
          enum: [failed, queued]
        last_attempt_at: { $ref: "#/components/schemas/Timestamp" }

    Budget:
      description: 当月数据源用量估算；到上限时暂停回补与新增付费请求。
      type: object
      required: [month, spent_usd, limit_usd, state]
      properties:
        month: { type: string, example: "2026-10" }
        spent_usd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
        limit_usd: { $ref: "#/components/schemas/Decimal" }
        state:
          type: string
          enum: [normal, warn, history_paused, paused]

    AdminHealth:
      type: object
      required: [as_of, chains, parsers, failures, budget]
      properties:
        as_of: { $ref: "#/components/schemas/Timestamp" }
        chains:
          type: array
          items: { $ref: "#/components/schemas/ChainHealth" }
        parsers:
          type: array
          items: { $ref: "#/components/schemas/ParserHealth" }
        failures:
          type: array
          items: { $ref: "#/components/schemas/ParseFailure" }
        budget: { $ref: "#/components/schemas/Budget" }
