# Example configuration file.
# Copy to config.yaml and fill in real values.
# Secrets (database password, RPC keys) must be supplied via environment variables
# or a secrets manager — never committed to the repository.
#
# Environment variable overrides (take precedence over this file):
#   RADAR_DATABASE_URL   — full DSN, e.g. postgres://user:pass@host:5432/db?sslmode=disable
#   RADAR_HTTP_ADDR      — listen address, e.g. :8080
#   RADAR_LOG_LEVEL      — debug | info | warn | error
#   RADAR_LOG_FILE       — optional log file tailed by Grafana Alloy
#   RADAR_ROLE           — all | ingest | parse | compute | api

log:
  level: info
  # Optional: duplicate JSON logs to a file for Grafana (make obs-up). Leave empty for stdout only.
  file: ""
  role: all

http:
  addr: ":8080"

database:
  # Leave empty and set RADAR_DATABASE_URL in the environment for local dev.
  url: ""

raw_store:
  # Development: local directory for raw block files (D75).
  # Production: leave empty and configure S3 credentials via environment.
  local_dir: ".local/raw"
