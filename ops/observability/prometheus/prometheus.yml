# Scrapes every radar role's /metrics (RADAR_METRICS_ADDR, :9100) on the
# compose network (docs/engineering/08-observability.md).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: radar
    static_configs:
      - targets:
          - ingest-solana:9100
          - ingest-base:9100
          - ingest-bsc:9100
          - backfill-solana:9100
          - backfill-base:9100
          - backfill-bsc:9100
          - parse-solana:9100
          - parse-base:9100
          - parse-bsc:9100
          - compute:9100
          - enrich:9100
          - api:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: service
