apiVersion: 1
datasources:
  - name: Loki
    uid: radar-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: '/explore?left={"datasource":"radar-loki","queries":[{"expr":"{service=\"radar\"} |= \"$${__value.raw}\""}]}'
